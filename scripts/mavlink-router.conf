# mavlink-router — three aircraft into one GCS.
#
# Rule 8.13 requires all drones through a single ground control station and a
# unified operator interface: 50 binary points, with multi-drone collaborative
# execution a further 50. The aircraft are told apart by MAVLink source system
# id, set per airframe by SYSID_THISMAV in firmware/ardupilot-params/.
#
#   drone 1 (SYSID 1) ──► :14541 ─┐
#   drone 2 (SYSID 2) ──► :14542 ─┼─► mavlink-router ─► 127.0.0.1:14550 ─► GCS
#   drone 3 (SYSID 3) ──► :14543 ─┘                  └─ 127.0.0.1:14551 ─► tools
#
# Run:  mavlink-routerd -c scripts/mavlink-router.conf
#
# VERIFIED, not assumed. Built mavlink-router 2362c62 and ran this against
# three ArduCopter SITL instances: all three SYSIDs arrive on the single GCS
# port, ~36 messages each in 20 s. Logging writes a .bin as configured.
# scripts/test-mavlink-router.sh reproduces both checks.
#
# NOTE ON THE MESH. These endpoints are the 5.8 GHz batman-adv mesh, not the
# 868 MHz safety radio. Abort and recall deliberately do NOT travel here — the
# reason to abort is frequently that this link has failed. See
# communication/safety_link/.

[General]
TCPServerPort = 5760
ReportStats = false
MavlinkDialect = ardupilotmega
# Log every frame. Rule 8.6 lets the jury inspect, and a flight without a log is
# a flight you cannot learn from.
Log = ./logs/mavlink
LogMode = while-armed

# --- aircraft, over the mesh ------------------------------------------------
# Mode = SERVER, and this is the part that was wrong.
#
# These endpoints used to be `Mode = Normal` pointed at mesh IPs 10.0.0.11-13.
# Normal opens a UDP *client*: mavlink-router SENDS to that address and only
# hears replies to its own source port. It therefore works only if the AIRCRAFT
# is sitting there listening.
#
# Tested with a real aircraft that initiates -- which is what a companion
# computer normally does, and what our own SITL harness does:
#
#     Mode = Normal, aircraft initiates  ->  0 messages routed
#     Mode = Server, aircraft initiates  ->  all three SYSIDs on one port
#
# Zero. Not degraded, nothing at all. The config parsed cleanly and started
# without complaint the whole time, which is why this survived until someone
# ran it against an aircraft.
#
# Server binds a port, so each aircraft needs its OWN port rather than its own
# IP. That is a change on the aircraft side too: each companion sends to
# <gcs>:1454N, not all three to :14550.
#
# The per-endpoint AllowSrcSystems filter is kept, and it is worth the extra
# ports: a misconfigured airframe announcing the wrong SYSID cannot masquerade
# as another drone.
#
# IF the aircraft are instead configured as UDP servers (listening), revert
# these three to Mode = Normal with the mesh IPs. That arrangement is untested.

[UdpEndpoint drone1]
Mode = Server
Address = 0.0.0.0
Port = 14541
AllowSrcSystems = 1

[UdpEndpoint drone2]
Mode = Server
Address = 0.0.0.0
Port = 14542
AllowSrcSystems = 2

[UdpEndpoint drone3]
Mode = Server
Address = 0.0.0.0
Port = 14543
AllowSrcSystems = 3

# --- ground station ---------------------------------------------------------
# The GCS sees all three. mission_backend/mavlink_ingest.py keys on
# get_srcSystem() and fans them into one Fleet.

[UdpEndpoint gcs]
Mode = Normal
Address = 127.0.0.1
Port = 14550

# Second local endpoint so a recorder or analysis tool can attach without
# competing with the GCS for the same socket.
[UdpEndpoint tools]
Mode = Normal
Address = 127.0.0.1
Port = 14551
